<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音素材解析实验室 · AI创作中心</title><style>:root{color-scheme:dark;--bg:#080a0e;--p:#11151d;--p2:#0b0f15;--line:#283141;--tx:#f5f7fb;--mut:#8c98aa;--a:#69dfea;--purple:#a68cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#142130,#080a0e 45%);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;padding:22px}.wrap{max-width:980px;margin:auto}.nav{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px}.nav a{color:#aeb8c6;text-decoration:none}.hero h1{font-size:clamp(34px,5vw,54px);margin:0 0 8px}.hero p{color:var(--mut);line-height:1.7}.panel{margin-top:20px;border:1px solid rgba(255,255,255,.08);background:rgba(17,21,29,.95);border-radius:24px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.35)}textarea,input{width:100%;background:var(--p2);border:1px solid var(--line);color:#fff;border-radius:14px;padding:14px;font:inherit;outline:none}textarea{min-height:135px;resize:vertical;line-height:1.65}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn,button{border:1px solid #2b3749;background:#182131;color:#eaf1fa;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{border:0;background:linear-gradient(135deg,#5ce3ee,#9df5f7);color:#071216}.ai{border:0;background:linear-gradient(135deg,#8e7cff,#c4a0ff);color:#120d23}.btn:disabled,button:disabled{opacity:.45;cursor:not-allowed}.status{display:none;margin-top:14px;padding:13px;border:1px solid #263244;border-radius:14px;background:#0c1118;color:#aeb8c5}.status.show{display:block}.status.bad{color:#ff9cac;border-color:#61303a}.result{display:none;grid-template-columns:190px 1fr;gap:18px;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.07)}.result.show{display:grid}.cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:#080b10}.result h2{margin:4px 0 8px;font-size:20px}.muted{color:var(--mut)}.tools{display:none;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.tools.show{display:grid}.tool{padding:15px;border:1px solid #273142;border-radius:15px;background:#0c1118}.tool h3{margin:0 0 7px;font-size:15px}.tool p{color:#8490a2;font-size:12px;line-height:1.55;min-height:55px}.output{display:none;margin-top:14px;padding:16px;border:1px solid #29364a;border-radius:15px;background:#090d13}.output.show{display:block}.outHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.output pre{white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto;line-height:1.7}.cookie{margin-top:12px}.cookie summary{cursor:pointer;color:#aeb8c6}.cookieBox{margin-top:12px}.small{font-size:12px;color:#748196}@media(max-width:700px){body{padding:14px}.panel{padding:16px}.result.show{grid-template-columns:1fr}.cover{max-width:240px}.tools.show{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="nav"><a href="/">← AI 深度创作中心</a><a href="/history.html">历史人物角色 →</a></div><div class="hero"><h1>抖音素材解析实验室</h1><p>把公开抖音作品转化为可用于学习与创作的素材：解析视频、下载、提取文字，并调用现有 AI 视频分析能力。</p></div><section class="panel"><textarea id="txt" placeholder="粘贴抖音完整分享文案或 douyin.com 链接……"></textarea><div class="row"><button class="primary" id="parse">开始解析</button><button id="clear">清空</button><span class="small" id="health">检查服务中…</span></div><details class="cookie"><summary>遇到抖音风控时设置 Cookie</summary><div class="cookieBox"><input id="cookie" type="password" placeholder="粘贴 Cookie，仅发送到你自己的 Render 服务"><div class="small" style="margin-top:7px">Cookie 不会写入 GitHub；仅在需要鉴权的解析请求中使用。</div></div></details><div class="status" id="status"></div><div class="result" id="result"><img id="cover" class="cover"><div><div class="small" id="badges"></div><h2 id="title"></h2><div class="muted" id="author"></div><div class="row"><a id="download" class="btn primary">下载视频</a><a id="page" class="btn" target="_blank" rel="noopener">打开原作品</a><button id="copyUrl">复制视频地址</button></div></div></div><div class="tools" id="tools"><div class="tool"><h3>① 下载素材</h3><p>通过现有后端下载接口获取解析结果。</p><button class="primary" id="dlTool">下载视频</button></div><div class="tool"><h3>② 提取文字</h3><p>优先读取文案/字幕，无字幕时按服务器配置决定是否转写。</p><button id="textBtn">提取文字</button></div><div class="tool"><h3>③ AI 内容分析</h3><p>分析结构、情绪、镜头与创作优化方向。</p><button class="ai" id="aiBtn">分析视频</button></div></div><div class="output" id="textOut"><div class="outHead"><b>文字结果</b><button id="copyText">复制</button></div><pre id="textContent"></pre></div><div class="output" id="aiOut"><div class="outHead"><b>AI 分析结果</b><button id="copyAi">复制</button></div><pre id="aiContent"></pre></div></section></div><script>const $=id=>document.getElementById(id);let token='',videoUrl='';function stat(t,b=false){$('status').textContent=t;$('status').className='status show'+(b?' bad':'')}function clip(t){navigator.clipboard.writeText(t||'').then(()=>stat('已复制到剪贴板'))}fetch('/api/health').then(r=>r.json()).then(d=>{$('health').textContent=d.ai_configured?'服务在线 · AI已配置':'服务在线 · AI未配置';$('aiBtn').disabled=!d.ai_configured}).catch(()=>{$('health').textContent='服务状态未知'});$('parse').onclick=async()=>{const input=$('txt').value.trim();if(!input)return stat('请先粘贴抖音分享文案或链接',true);$('parse').disabled=true;stat('正在解析作品…');$('result').classList.remove('show');$('tools').classList.remove('show');try{const r=await fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:input,cookie:$('cookie').value.trim()})});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'解析失败');token=d.token||'';videoUrl=d.url||'';$('cover').src=d.cover||'';$('title').textContent=d.title||d.description||'未命名作品';$('author').textContent=d.author?'作者：'+d.author:'';$('badges').textContent=[d.mode,d.elapsed?d.elapsed+'s':'',d.duration?Math.round(d.duration)+'秒':''].filter(Boolean).join(' · ');$('download').href='/api/download/'+token;$('dlTool').onclick=()=>location.href='/api/download/'+token;$('page').href=d.webpage_url||d.resolved_url||'#';$('result').classList.add('show');$('tools').classList.add('show');stat('解析完成');}catch(e){stat(e.message||'解析失败',true)}finally{$('parse').disabled=false}};$('textBtn').onclick=async()=>{if(!token)return;stat('正在提取文字…');try{const r=await fetch('/api/text/'+token,{method:'POST'}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'提取失败');$('textContent').textContent=d.text||'未提取到文字';$('textOut').classList.add('show');stat('文字提取完成')}catch(e){stat(e.message,true)}};$('aiBtn').onclick=async()=>{if(!token)return;stat('正在分析视频内容…');try{const r=await fetch('/api/analyze/'+token,{method:'POST'}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'分析失败');$('aiContent').textContent=d.analysis||d.text||JSON.stringify(d,null,2);$('aiOut').classList.add('show');stat('AI 分析完成')}catch(e){stat(e.message,true)}};$('copyUrl').onclick=()=>clip(videoUrl);$('copyText').onclick=()=>clip($('textContent').textContent);$('copyAi').onclick=()=>clip($('aiContent').textContent);$('clear').onclick=()=>{location.reload()};</script></body></html>
